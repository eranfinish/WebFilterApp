<!doctype html>
<!--
  Store screenshot, 1280x800. Query: lang=en|he, shot=blocked|channels|popup.
  The picture in the window is the real extension page, captured by capture.mjs (tools/captures/<lang>-<shot>.png, at 2x)
  from the test build in Edge with a simulated service. The text on the side describes what version 0.3.1 does.
-->
<html>
<head>
  <meta charset="utf-8">
  <title>WebFilter screenshot</title>
  <style>
    html, body {
      margin: 0;
      width: 1280px;
      height: 800px;
      overflow: hidden;
    }
    body {
      display: flex;
      align-items: center;
      gap: 56px;
      padding: 0 64px;
      box-sizing: border-box;
      background: linear-gradient(160deg, #eef4fd 0%, #f7f9fc 55%, #e9eff9 100%);
      color: #17202c;
      font-family: "Segoe UI", system-ui, Arial, sans-serif;
    }
    .copy {
      flex: 1;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 26px;
      font-weight: 700;
      color: #1d5fd1;
    }
    h1 {
      margin: 26px 0 0;
      font-size: 40px;
      line-height: 1.18;
      font-weight: 700;
      letter-spacing: -0.4px;
      text-wrap: balance;
    }
    ul {
      margin: 28px 0 0;
      padding: 0;
      list-style: none;
    }
    li {
      position: relative;
      margin: 0 0 16px;
      padding-inline-start: 34px;
      font-size: 20px;
      line-height: 1.4;
      color: #334155;
    }
    li::before {
      content: "";
      position: absolute;
      inset-inline-start: 0;
      top: 6px;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: #1f8a4c;
      box-shadow: inset 0 0 0 5px #d5f0df;
    }

    /* Generic browser window (no real browser branding). */
    .window {
      flex: none;
      width: 680px;
      border-radius: 14px;
      background: #ffffff;
      box-shadow: 0 24px 60px rgba(20, 40, 80, 0.18), 0 2px 6px rgba(20, 40, 80, 0.08);
      overflow: hidden;
    }
    .toolbar {
      display: flex;
      align-items: center;
      gap: 12px;
      height: 52px;
      padding: 0 14px;
      background: #f1f3f6;
      border-bottom: 1px solid #dde2e8;
      direction: ltr;
    }
    .dots {
      display: flex;
      gap: 7px;
    }
    .dots span {
      width: 11px;
      height: 11px;
      border-radius: 50%;
      background: #cfd5dd;
    }
    .omnibox {
      flex: 1;
      height: 28px;
      border-radius: 14px;
      background: #ffffff;
      border: 1px solid #dde2e8;
    }
    .ext-button {
      display: grid;
      place-items: center;
      width: 34px;
      height: 34px;
      border-radius: 8px;
      background: #dbe6f7;
    }
    .page {
      display: block;
      width: 680px; /* the capture is 800x600 CSS px at 2x */
    }
    .viewport {
      position: relative;
      height: 600px;
      padding: 28px;
      box-sizing: border-box;
      background: #fafbfc;
      direction: ltr;
    }
    .skeleton div {
      height: 14px;
      margin-bottom: 14px;
      border-radius: 7px;
      background: #eceff3;
    }
    .popup {
      position: absolute;
      top: 6px;
      right: 10px;
      border-radius: 12px;
      overflow: hidden;
      background: #ffffff;
      box-shadow: 0 14px 40px rgba(20, 40, 80, 0.22), 0 0 0 1px rgba(20, 40, 80, 0.08);
    }
    .popup img {
      display: block;
    }
  </style>
</head>
<body>
  <div class="copy">
    <div class="brand"><span id="brand-mark"></span>WebFilter</div>
    <h1 id="headline"></h1>
    <ul id="points"></ul>
  </div>

  <div class="window">
    <div class="toolbar">
      <div class="dots"><span></span><span></span><span></span></div>
      <div class="omnibox"></div>
      <div class="ext-button" id="ext-button"></div>
    </div>
    <div id="content"></div>
  </div>

  <script src="shield.js"></script>
  <script>
    const text = {
      en: {
        dir: "ltr",
        blocked: {
          headline: "A blocked page says why, and the child can ask for access",
          points: [
            "Approved sites only, or blocked categories, for each child",
            "The request reaches the parents in the WebFilter app",
            "Once a parent approves, the page opens by itself",
          ],
        },
        channels: {
          headline: "YouTube: only the channels the parents approved",
          points: [
            "Restricted Mode, approved channels only, and no Shorts",
            "Older children can search for a channel and ask for it",
            "Parents see the channel's name in every request",
          ],
        },
        popup: {
          headline: "Works with the WebFilter program for Windows",
          points: [
            "Installed by browser policy in each child's Windows account",
            "Daily browsing time and allowed hours, with ad blocking",
            "Decisions are made on the computer; nothing is sent to the developer",
          ],
        },
      },
      he: {
        dir: "rtl",
        blocked: {
          headline: "דף חסום מסביר למה, והילד יכול לבקש גישה",
          points: [
            "רק אתרים מאושרים, או קטגוריות חסומות, לכל ילד",
            "הבקשה מגיעה להורים בתוכנת WebFilter",
            "כשההורה מאשר, הדף נפתח לבד",
          ],
        },
        channels: {
          headline: "YouTube: רק הערוצים שההורים אישרו",
          points: [
            "מצב מוגבל, רק ערוצים מאושרים, ובלי Shorts",
            "ילדים גדולים יותר יכולים לחפש ערוץ ולבקש אותו",
            "ההורים רואים את שם הערוץ בכל בקשה",
          ],
        },
        popup: {
          headline: "עובד יחד עם תוכנת WebFilter ל-Windows",
          points: [
            "מותקן דרך מדיניות הדפדפן, בחשבון של כל ילד",
            "זמן גלישה יומי ושעות מותרות, עם חסימת פרסומות",
            "ההחלטות מתקבלות במחשב עצמו; שום דבר לא נשלח למפתח",
          ],
        },
      },
    };
    const params = new URLSearchParams(location.search);
    const lang = params.get("lang") === "he" ? "he" : "en";
    const shot = ["blocked", "channels", "popup"].includes(params.get("shot")) ? params.get("shot") : "blocked";
    const t = text[lang];
    document.documentElement.lang = lang;
    document.documentElement.dir = t.dir;
    document.getElementById("headline").textContent = t[shot].headline;
    for (const point of t[shot].points) {
      const li = document.createElement("li");
      li.textContent = point;
      document.getElementById("points").append(li);
    }
    document.getElementById("brand-mark").innerHTML = shieldSvg({ size: 40 });
    document.getElementById("ext-button").innerHTML = shieldSvg({ size: 21 });

    const image = new Image();
    image.src = `../captures/${lang}-${shot}.png`;
    const content = document.getElementById("content");
    if (shot === "popup") {
      // The popup over a page, at its real size (the capture is 2x).
      content.innerHTML = `<div class="viewport"><div class="skeleton">
        <div style="width: 70%"></div><div style="width: 90%"></div><div style="width: 82%"></div>
        <div style="width: 60%"></div><div style="width: 88%"></div><div style="width: 75%"></div></div>
        <div class="popup" id="popup"></div></div>`;
      document.getElementById("popup").append(image);
    } else {
      image.className = "page";
      content.append(image);
    }
    image.decode().then(() => {
      if (shot === "popup") image.style.width = image.naturalWidth / 2 * 1.2 + "px"; // slightly enlarged to stay legible
      return document.fonts.ready;
    }).then(() => {
      document.documentElement.dataset.ready = "1";
    });
  </script>
</body>
</html>
