<!doctype html>
<!--
  Store screenshot, 1280x800. Query: lang=en|he.
  The popup on the right is the real extension-s1/popup.html, loaded in an iframe. render.mjs injects a stub of
  chrome.i18n / chrome.management so it shows the force-installed state ("admin") with the chosen locale.
-->
<html>
<head>
  <meta charset="utf-8">
  <title>WebFilter screenshot</title>
  <style>
    html, body {
      margin: 0;
      width: 1280px;
      height: 800px;
      overflow: hidden;
    }
    body {
      display: flex;
      align-items: center;
      gap: 64px;
      padding: 0 80px;
      box-sizing: border-box;
      background: linear-gradient(160deg, #eef4fd 0%, #f7f9fc 55%, #e9eff9 100%);
      color: #17202c;
      font-family: "Segoe UI", system-ui, Arial, sans-serif;
    }
    .copy {
      flex: 1;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 26px;
      font-weight: 700;
      color: #1d5fd1;
    }
    h1 {
      margin: 28px 0 0;
      font-size: 44px;
      line-height: 1.18;
      font-weight: 700;
      letter-spacing: -0.4px;
      text-wrap: balance;
    }
    ul {
      margin: 30px 0 0;
      padding: 0;
      list-style: none;
    }
    li {
      position: relative;
      margin: 0 0 16px;
      padding-inline-start: 34px;
      font-size: 21px;
      line-height: 1.4;
      color: #334155;
    }
    li::before {
      content: "";
      position: absolute;
      inset-inline-start: 0;
      top: 6px;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: #1f8a4c;
      box-shadow: inset 0 0 0 5px #d5f0df;
    }

    /* Generic browser window (no real browser branding). */
    .window {
      flex: none;
      width: 600px;
      height: 700px;
      border-radius: 14px;
      background: #ffffff;
      box-shadow: 0 24px 60px rgba(20, 40, 80, 0.18), 0 2px 6px rgba(20, 40, 80, 0.08);
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    .toolbar {
      display: flex;
      align-items: center;
      gap: 12px;
      height: 56px;
      padding: 0 14px;
      background: #f1f3f6;
      border-bottom: 1px solid #dde2e8;
    }
    .dots {
      display: flex;
      gap: 7px;
    }
    .dots span {
      width: 11px;
      height: 11px;
      border-radius: 50%;
      background: #cfd5dd;
    }
    .omnibox {
      flex: 1;
      height: 30px;
      border-radius: 15px;
      background: #ffffff;
      border: 1px solid #dde2e8;
    }
    .ext-button {
      display: grid;
      place-items: center;
      width: 36px;
      height: 36px;
      border-radius: 8px;
      background: #dbe6f7;
    }
    .viewport {
      position: relative;
      flex: 1;
      padding: 28px;
      background: #fafbfc;
    }
    .skeleton {
      direction: ltr;
    }
    .skeleton div {
      height: 14px;
      margin-bottom: 14px;
      border-radius: 7px;
      background: #eceff3;
    }
    .popup {
      position: absolute;
      top: 6px;
      inset-inline-end: 10px;
      direction: ltr; /* keeps the scaled iframe anchored left; the popup sets its own direction */
      border-radius: 12px;
      overflow: hidden;
      background: #ffffff;
      box-shadow: 0 14px 40px rgba(20, 40, 80, 0.22), 0 0 0 1px rgba(20, 40, 80, 0.08);
    }
    .popup iframe {
      display: block;
      width: 320px;
      border: 0;
      transform-origin: top left;
    }
  </style>
</head>
<body>
  <div class="copy">
    <div class="brand"><span id="brand-mark"></span>WebFilter</div>
    <h1 id="headline"></h1>
    <ul id="points"></ul>
  </div>

  <div class="window">
    <div class="toolbar">
      <div class="dots"><span></span><span></span><span></span></div>
      <div class="omnibox"></div>
      <div class="ext-button" id="ext-button"></div>
    </div>
    <div class="viewport">
      <div class="skeleton">
        <div style="width: 70%"></div><div style="width: 90%"></div><div style="width: 82%"></div>
        <div style="width: 60%"></div><div style="width: 88%"></div><div style="width: 75%"></div>
      </div>
      <div class="popup" id="popup">
        <iframe id="popup-frame" src="../../extension-s1/popup.html" scrolling="no" title="WebFilter popup"></iframe>
      </div>
    </div>
  </div>

  <script src="shield.js"></script>
  <script>
    const text = {
      en: {
        dir: "ltr",
        headline: "See at a glance whether WebFilter was installed by policy",
        points: [
          "Shows whether the computer's browser policy force-installed the extension",
          "Shows the extension ID and version",
          "No permissions. No data collected.",
        ],
      },
      he: {
        dir: "rtl",
        headline: "רואים במבט אחד אם WebFilter הותקן על ידי מדיניות",
        points: [
          "מציג אם מדיניות הדפדפן במחשב התקינה את התוסף בכפייה",
          "מציג את מזהה התוסף ואת הגרסה",
          "בלי הרשאות. בלי איסוף מידע.",
        ],
      },
    };
    const lang = new URLSearchParams(location.search).get("lang") === "he" ? "he" : "en";
    const t = text[lang];
    document.documentElement.lang = lang;
    document.documentElement.dir = t.dir;
    document.getElementById("headline").textContent = t.headline;
    for (const point of t.points) {
      const li = document.createElement("li");
      li.textContent = point;
      document.getElementById("points").append(li);
    }
    document.getElementById("brand-mark").innerHTML = shieldSvg({ size: 40 });
    document.getElementById("ext-button").innerHTML = shieldSvg({ size: 22 });

    const frame = document.getElementById("popup-frame");
    // Show the popup enlarged (up to 1.5x) so it stays legible, but never taller than the window.
    function fit() {
      const height = frame.contentDocument.documentElement.scrollHeight;
      const popup = document.getElementById("popup");
      const available = document.querySelector(".viewport").clientHeight - popup.offsetTop - 16;
      const scale = Math.min(1.5, available / height);
      frame.style.height = height + "px";
      frame.style.transform = "scale(" + scale + ")";
      popup.style.width = 320 * scale + "px";
      popup.style.height = height * scale + "px";
      Promise.all([document.fonts.ready, frame.contentDocument.fonts.ready]).then(() => {
        document.documentElement.dataset.ready = "1";
      });
    }
    if (frame.contentDocument && frame.contentDocument.readyState === "complete" &&
        frame.contentDocument.getElementById("status")) {
      fit();
    } else {
      frame.addEventListener("load", fit);
    }
  </script>
</body>
</html>
